{% load djpa %}
{% comment %}
The reply of a run while it streams. The data-effect opens the stream. It
opens a new stream each time the stream view changes the _djpaStream signal.
The stream view replaces this element at the end of the run.
{% endcomment %}
<div id="djpa-reply-{{ turn_id }}" class="djpa-reply"
     data-effect="$_djpaStream; @get('{% url 'dj_pydantic_agents:stream_turn' turn_id %}', {requestCancellation: 'cleanup', filterSignals: {include: /^$/}})">
  <div id="djpa-reply-{{ turn_id }}-text" class="djpa-reply__text"></div>
</div>
