{% load i18n %}
{% comment %}
The message form. The context: conversation_id, is_closed, csrf_token and
focus. The form is closed while a turn is active. With focus, the input gets
the focus when the form opens again after a run.
{% endcomment %}
<form id="djpa-message-form" class="djpa-message-form"
      data-on:submit="@post('{% url 'dj_pydantic_agents:send_message' conversation_id %}', {contentType: 'form', headers: {'X-CSRFToken': '{{ csrf_token }}'}})">
  <textarea name="prompt" class="djpa-message-form__input" required{% if is_closed %} disabled{% endif %}{% if focus %} data-init="el.focus()"{% endif %}></textarea>
  <button type="submit" class="djpa-message-form__send"{% if is_closed %} disabled{% endif %}>{% translate "Send" %}</button>
</form>
