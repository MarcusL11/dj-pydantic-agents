# PostgreSQL and Redis for the package tests. Start them with: docker compose up -d
services:
  postgres:
    image: docker.io/postgres:16
    environment:
      POSTGRES_DB: dj_pydantic_agents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: docker.io/redis:8
    ports:
      - "6380:6379"

volumes:
  postgres_data: {}
