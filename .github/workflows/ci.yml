name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [locked, lowest-direct]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dj_pydantic_agents
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install the locked versions
        if: matrix.resolution == 'locked'
        run: uv sync --locked

      - name: Install the lowest direct versions
        if: matrix.resolution == 'lowest-direct'
        run: uv sync --resolution lowest-direct

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Types
        run: uv run --no-sync mypy src tests

      - name: Tests
        run: uv run --no-sync pytest
